[package]
name = "ssb-noise-filter"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Real-time noise filter for ham radio SSB voice (RNNoise + bandpass)"

[dependencies]
cpal = "0.18"
# glow (OpenGL) instead of the default wgpu (Vulkan): Intel Vulkan drivers
# crash on some machines, OpenGL is the maximally-compatible path
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.36"
nnnoiseless = { version = "0.5.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
